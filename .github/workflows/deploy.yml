name: Deploy Website

on:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Kiểm tra đủ 3 file
        run: |
          if [ ! -f index.html ]; then
            echo "❌ Thiếu file index.html"
            exit 1
          fi
          if [ ! -f style.css ]; then
            echo "❌ Thiếu file style.css"
            exit 1
          fi
          if [ ! -f script.js ]; then
            echo "❌ Thiếu file script.js"
            exit 1
          fi
          echo "✅ Đủ 3 file"

      - name: Kiểm tra thẻ title trong index.html
        run: |
          if ! grep -q "<title>" index.html; then
            echo "❌ Thiếu thẻ <title> trong index.html"
            exit 1
          fi
          echo "✅ Có thẻ <title>"

  deploy:
    needs: check          # Chỉ chạy khi job check thành công
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
